openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Source-backed bail observations in a shared, password-protected workspace. No synthetic docket or case records are permitted.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bail-records
    description: Source-backed docket observations and descriptive bail ranges
  - name: workspace-access
    description: Shared password access to the research workspace
paths:
  /workspace-access/session:
    get:
      operationId: getWorkspaceSession
      tags: [workspace-access]
      summary: Check shared workspace access
      responses:
        "200":
          description: Whether the browser has a valid workspace session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSession" }
  /workspace-access/enter:
    post:
      operationId: enterWorkspace
      tags: [workspace-access]
      summary: Unlock the shared workspace with its password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspacePasswordInput" }
      responses:
        "200":
          description: Workspace session created in an HttpOnly cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /workspace-access/lock:
    post:
      operationId: lockWorkspace
      tags: [workspace-access]
      summary: Lock the current browser session
      security:
        - workspaceAccessCookie: []
      responses:
        "204":
          description: Session cookie cleared
        "403": { $ref: "#/components/responses/Forbidden" }
  /discovery/policy:
    get:
      operationId: getDiscoveryPolicy
      tags: [bail-records]
      responses:
        "200":
          description: Demonstrated coverage and protected collection limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /discovery/jobs:
    get:
      operationId: listDiscoveryJobs
      tags: [bail-records]
      responses:
        "200":
          description: Jobs in the shared workspace
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DiscoveryJob" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createDiscoveryJob
      tags: [bail-records]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryCriteria" }
      responses:
        "201":
          description: Bounded live collection explicitly queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /discovery/calendar-previews:
    post:
      operationId: createCalendarPreview
      tags: [bail-records]
      summary: Run one calendar-only preview without retrieving docket documents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarPreviewInput" }
      responses:
        "201":
          description: One explicitly initiated, paced Calendar Event preview was queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /discovery/assessments:
    get:
      operationId: listDiscoveryAssessments
      tags: [bail-records]
      summary: Read operator-prepared pilot scopes and evidence status; never approve or run them
      responses:
        "200":
          description: Pilot protocols, explicitly distinct from authorization to collect
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DiscoveryAssessment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /discovery/jobs/{jobId}:
    get:
      operationId: getDiscoveryJob
      tags: [bail-records]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Persisted progress, evidence and request accounting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /discovery/jobs/{jobId}/control:
    post:
      operationId: controlDiscoveryJob
      tags: [bail-records]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryControl" }
      responses:
        "200":
          description: Job paused, cancelled, or explicitly resumed within its original budget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /discovery/jobs/{jobId}/candidates:
    post:
      operationId: saveDiscoveryCandidates
      tags: [bail-records]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryCandidateSelection" }
      responses:
        "200":
          description: Selected source-backed dockets and their extracted observations saved atomically; existing review states are preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryCandidateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /discovery/jobs/{jobId}/items/{itemId}/save:
    post:
      operationId: saveDiscoveryObservation
      tags: [bail-records]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryObservationInput" }
      responses:
        "200":
          description: Saved or already-saved pending source observation, never automatically confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BailRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /records:
    get:
      operationId: listBailRecords
      tags: [bail-records]
      summary: Search saved docket observations
      description: Searches records already entered by volunteers. It does not contact court sources. No person-name search is supported.
      parameters:
        - in: query
          name: query
          schema: { type: string, maxLength: 120 }
        - in: query
          name: reviewStatus
          schema: { $ref: "#/components/schemas/ReviewStatus" }
        - in: query
          name: courtLevel
          schema: { $ref: "#/components/schemas/CourtLevel" }
        - in: query
          name: county
          schema: { type: string, maxLength: 80 }
        - in: query
          name: chargeGroup
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Matching saved observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BailRecordList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBailRecord
      tags: [bail-records]
      summary: Enter a source-backed docket observation
      description: Creates a pending-review observation. Requires a source URL, evidence, source-consultation timestamp and a real-source attestation. Synthetic docket records are prohibited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BailRecordInput"
      responses:
        "201":
          description: Observation created and queued for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BailRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /records/{recordId}/review:
    post:
      operationId: reviewBailRecord
      tags: [bail-records]
      summary: Review a pending observation
      description: Records a human evidence decision and a separate order interpretation without overwriting the submitted source evidence.
      parameters:
        - in: path
          name: recordId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BailReviewInput"
      responses:
        "200":
          description: Reviewed observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BailRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /analytics/bail-range:
    get:
      operationId: getBailRange
      tags: [bail-records]
      summary: Calculate a descriptive range from reviewed records
      description: Uses confirmed, reviewed-operative observations only, one bail category and one financial basis at a time. This is a descriptive summary, not a recommendation for an individual case.
      parameters:
        - in: query
          name: courtLevel
          schema: { $ref: "#/components/schemas/CourtLevel" }
        - in: query
          name: county
          schema: { type: string, maxLength: 80 }
        - in: query
          name: chargeGroup
          schema: { type: string, maxLength: 120 }
        - in: query
          name: financialBasis
          schema: { $ref: "#/components/schemas/FinancialBasis" }
        - in: query
          name: bailCategory
          schema: { $ref: "#/components/schemas/BailCategory" }
      responses:
        "200":
          description: Descriptive range and included record count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BailRange"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    workspaceAccessCookie:
      type: apiKey
      in: cookie
      name: cbr_workspace
  schemas:
    WorkspacePasswordInput:
      type: object
      properties:
        password: { type: string, minLength: 1, maxLength: 256, format: password }
      required: [password]
    WorkspaceSession:
      type: object
      properties:
        authenticated: { type: boolean }
        expiresInSeconds: { type: integer, minimum: 1 }
      required: [authenticated]
    DiscoveryCriteria:
      type: object
      properties:
        courtOffice: { type: string, enum: [CP-05-02-Crim, CP-05-02-Fam, CP-05-02-Juv], description: "Calendar options observed October 12, 2026; not proof of criminal result or PDF coverage." }
        courtRoom: { type: string, maxLength: 80 }
        eventType: { type: string, enum: [Bail Hearing, Preliminary Arraignment, ANY] }
        calendarPreviewOnly: { type: boolean }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        recordCap: { type: integer, minimum: 1, maximum: 200 }
        requestCap: { type: integer, minimum: 8, maximum: 500 }
        matchTarget: { type: integer, minimum: 1, maximum: 200, description: "Requested distinct matching dockets. Absent only for legacy processing-cap jobs." }
        matchFilters: { $ref: "#/components/schemas/DiscoveryMatchFilters" }
      required: [courtOffice, eventType, startDate, endDate, recordCap, requestCap]
    CalendarPreviewInput:
      type: object
      properties:
        courtOffice: { type: string, enum: [CP-05-02-Crim, CP-05-02-Fam, CP-05-02-Juv], description: "Observed October 12, 2026; runtime availability must be checked." }
        eventType: { type: string, enum: [Bail Hearing, Preliminary Arraignment] }
        startDate: { type: string, format: date, description: "Real date, today or later in America/New_York." }
        endDate: { type: string, format: date, description: "Inclusive window of at most seven days." }
      required: [courtOffice, eventType, startDate, endDate]
    DiscoveryMatchFilters:
      type: object
      properties:
        monetaryUpperBoundCents: { type: ["integer", "null"], minimum: 1, maximum: 2147483647, description: "Local monetary TOTAL_BAIL maximum; null disables this filter." }
        excludeShownPosted: { type: boolean }
        inclusiveMaximum: { type: boolean, description: "Include the exact maximum. Absent on legacy jobs, whose strict comparison is preserved." }
      required: [monetaryUpperBoundCents, excludeShownPosted]
    DiscoveryPolicy:
      type: object
      properties:
        adapter: { type: string }
        minimumDate: { type: string, format: date }
        spacingMs: { type: integer }
        concurrency: { type: integer }
        automaticRetries: { type: integer }
        defaultRecordCap: { type: integer }
        maxRecordCap: { type: integer }
        defaultRequestCap: { type: integer }
        maxRequestCap: { type: integer }
        pausedUntil: { type: ["string", "null"], format: date-time }
        blockedReason: { type: ["string", "null"] }
        collectionEnabled: { type: boolean }
        accessVerifiedAt: { type: ["string", "null"], format: date-time }
        verifiedMethod: { type: ["string", "null"] }
        collectionApprovedAt: { type: ["string", "null"], format: date-time }
        hourlyRequestCap: { type: integer }
        dailyRequestCap: { type: integer }
        hourlyRequestsUsed: { type: integer }
        dailyRequestsUsed: { type: integer }
        currentSpacingMs: { type: integer }
        nextEligibleAt: { type: ["string", "null"], format: date-time }
        requestInFlight: { type: boolean }
        lastLatencyMs: { type: ["integer", "null"] }
        latencyWarning: { type: ["string", "null"] }
        throttleCount: { type: integer }
        pilotState: { type: string }
        calendarRequestAllowance: { type: integer }
        coverageNote: { type: string }
      required: [adapter, minimumDate, spacingMs, concurrency, automaticRetries, defaultRecordCap, maxRecordCap, defaultRequestCap, maxRequestCap, pausedUntil, blockedReason, collectionEnabled, accessVerifiedAt, verifiedMethod, collectionApprovedAt, hourlyRequestCap, dailyRequestCap, hourlyRequestsUsed, dailyRequestsUsed, currentSpacingMs, nextEligibleAt, requestInFlight, lastLatencyMs, latencyWarning, throttleCount, pilotState, calendarRequestAllowance, coverageNote]
    DiscoveryAssessment:
      type: object
      properties:
        id: { type: string, format: uuid }
        stage: { type: string, enum: [SINGLE, SMALL, MODEST, BOUNDED_ENGINE] }
        state: { type: string, enum: [PREPARED, APPROVED, ATTEMPTED, FAILED, VERIFIED, BOUNDED_COMPLETED] }
        criteria: { $ref: "#/components/schemas/DiscoveryCriteria" }
        expectedMethod: { type: string }
        approvedAt: { type: ["string", "null"], format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        report: { oneOf: [{ $ref: "#/components/schemas/DiscoveryAssessmentResult" }, { type: "null" }] }
      required: [id, stage, state, criteria, expectedMethod, approvedAt, expiresAt, startedAt, completedAt, report]
    DiscoveryAssessmentResult:
      type: object
      properties:
        requests: { type: integer }
        validDocuments: { type: integer }
        failures: { type: integer }
        reason: { type: string }
      required: [requests, validDocuments, failures, reason]
    DiscoveryCandidateSelection:
      type: object
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
      required: [itemIds]
    DiscoveryCandidateResult:
      type: object
      properties:
        docketCount: { type: integer }
        observationCount: { type: integer }
        recordIds: { type: array, items: { type: string, format: uuid } }
      required: [docketCount, observationCount, recordIds]
    DiscoveryControl:
      type: object
      properties:
        action: { type: string, enum: [PAUSE, CANCEL, RESUME] }
      required: [action]
    DiscoveryObservationInput:
      type: object
      properties:
        entryIndex: { type: ["integer", "null"], minimum: 0 }
      required: [entryIndex]
    DiscoveryJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        criteria: { $ref: "#/components/schemas/DiscoveryCriteria" }
        status: { type: string, enum: [QUEUED, RUNNING, PAUSED, CANCELLED, COMPLETED, FAILED] }
        requestsUsed: { type: integer }
        completedRequests: { type: integer }
        failedRequests: { type: integer }
        discovered: { type: integer }
        processed: { type: integer }
        matching: { type: integer }
        targetReached: { type: boolean }
        failed: { type: integer }
        unprocessed: { type: integer }
        calendarComplete: { type: boolean }
        paginationComplete: { type: boolean }
        resultCapReached: { type: boolean }
        message: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resultsExpireAt: { type: ["string", "null"], format: date-time }
        resultsExpiredAt: { type: ["string", "null"], format: date-time }
        candidateDockets: { type: integer }
        isAssessment: { type: boolean }
      required: [id, criteria, status, requestsUsed, completedRequests, failedRequests, discovered, processed, matching, targetReached, failed, unprocessed, calendarComplete, paginationComplete, resultCapReached, message, createdAt, updatedAt, resultsExpireAt, resultsExpiredAt, candidateDockets, isAssessment]
    PostedEntryState:
      type: string
      enum: [SHOWN_POSTED, NOT_SHOWN, UNKNOWN]
    ExtractionOutcome:
      type: string
      enum: [UNPROCESSED, EXTRACTED, MISSING_BAIL_SECTION, UNREADABLE, UNSUPPORTED_LAYOUT, IDENTITY_MISMATCH, RETRIEVAL_FAILED]
    DiscoveryEntry:
      type: object
      properties:
        action: { type: string }
        wording: { type: string }
        orderDate: { type: ["string", "null"], format: date }
        bailCategory: { $ref: "#/components/schemas/BailCategory" }
        amountCents: { type: ["integer", "null"] }
        financialBasis: { oneOf: [{ $ref: "#/components/schemas/FinancialBasis" }, { type: "null" }] }
        sourcePages:
          type: array
          description: One-based PDF pages supporting this entry; absent for legacy evidence.
          items: { type: integer, minimum: 1, maximum: 100 }
          uniqueItems: true
      required: [action, wording, orderDate, bailCategory, amountCents, financialBasis]
    DiscoveryProvenance:
      type: object
      properties:
        calendarUrl: { type: string, format: uri }
        calendarRetrievedAt: { type: string, format: date-time }
        eventType: { type: string }
        courtRoom: { type: ["string", "null"] }
        eventDate: { type: ["string", "null"] }
        filingDate: { type: ["string", "null"], format: date }
        courtOffice: { type: string }
        extractionOutcome: { $ref: "#/components/schemas/ExtractionOutcome" }
        postedEntryState: { $ref: "#/components/schemas/PostedEntryState" }
        entries: { type: array, items: { $ref: "#/components/schemas/DiscoveryEntry" } }
        documentSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        documentPageCount: { type: integer, minimum: 1, maximum: 100 }
        bailSectionPages:
          type: array
          description: One-based pages containing the inspected bail section.
          items: { type: integer, minimum: 1, maximum: 100 }
          uniqueItems: true
      required: [calendarUrl, calendarRetrievedAt, eventType, eventDate, filingDate, courtOffice, extractionOutcome, postedEntryState, entries]
    DiscoveryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        docketNumber: { type: string }
        position: { type: integer }
        sourceUrl: { type: string, format: uri }
        sourceRetrievedAt: { type: ["string", "null"], format: date-time }
        excerpt: { type: ["string", "null"] }
        detail: { type: ["string", "null"] }
        provenance: { $ref: "#/components/schemas/DiscoveryProvenance" }
        savedRecordIds: { type: array, items: { type: string, format: uuid } }
        savedObservations: { type: array, items: { $ref: "#/components/schemas/DiscoverySavedObservation" } }
      required: [id, docketNumber, position, sourceUrl, sourceRetrievedAt, excerpt, detail, provenance, savedRecordIds, savedObservations]
    DiscoverySavedObservation:
      type: object
      properties:
        entryIndex: { type: ["integer", "null"], minimum: 0 }
        recordId: { type: string, format: uuid }
        reviewStatus: { $ref: "#/components/schemas/ReviewStatus" }
        orderInterpretation: { $ref: "#/components/schemas/OrderInterpretation" }
      required: [entryIndex, recordId, reviewStatus, orderInterpretation]
    DiscoveryEvent:
      type: object
      properties:
        kind: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
      required: [kind, message, createdAt]
    DiscoveryReport:
      type: object
      properties:
        job: { $ref: "#/components/schemas/DiscoveryJob" }
        items: { type: array, items: { $ref: "#/components/schemas/DiscoveryItem" } }
        events: { type: array, items: { $ref: "#/components/schemas/DiscoveryEvent" } }
      required: [job, items, events]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CourtLevel:
      type: string
      enum: [MDJ, COMMON_PLEAS]
    BailCategory:
      type: string
      enum: [MONETARY, NOMINAL, UNSECURED, NONMONETARY, RECOGNIZANCE, DENIED, UNKNOWN]
    FinancialBasis:
      type: string
      enum: [TOTAL_BAIL, CASH_DEPOSIT, SURETY_BOND, UNSECURED_AMOUNT]
    ReviewStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED]
    OrderInterpretation:
      type: string
      enum: [UNREVIEWED, REVIEWED_OPERATIVE, SUPERSEDED, UNRESOLVED]
    BailReviewDecision:
      type: string
      enum: [CONFIRMED, REJECTED]
    BailRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        docketNumber: { type: string }
        county: { type: string }
        courtLevel: { $ref: "#/components/schemas/CourtLevel" }
        chargeGroup: { type: ["string", "null"] }
        bailCategory: { $ref: "#/components/schemas/BailCategory" }
        financialBasis: { oneOf: [{ $ref: "#/components/schemas/FinancialBasis" }, { type: "null" }] }
        amountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647 }
        orderDate: { type: ["string", "null"], format: date }
        sourceTitle: { type: string }
        sourceUrl: { type: string, format: uri }
        sourceRetrievedAt: { type: string, format: date-time }
        sourceObservedAt: { type: ["string", "null"], format: date-time }
        evidenceNote: { type: string }
        discoveryEvidence: { oneOf: [{ $ref: "#/components/schemas/DiscoveryProvenance" }, { type: "null" }] }
        reviewStatus: { $ref: "#/components/schemas/ReviewStatus" }
        orderInterpretation: { $ref: "#/components/schemas/OrderInterpretation" }
        reviewComment: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, docketNumber, county, courtLevel, chargeGroup, bailCategory, financialBasis, amountCents, orderDate, sourceTitle, sourceUrl, sourceRetrievedAt, sourceObservedAt, evidenceNote, reviewStatus, orderInterpretation, reviewComment, reviewedAt, createdAt]
    BailRecordInput:
      type: object
      properties:
        docketNumber: { type: string, minLength: 1, maxLength: 80 }
        county: { type: string, minLength: 1, maxLength: 80 }
        courtLevel: { $ref: "#/components/schemas/CourtLevel" }
        chargeGroup: { type: string, minLength: 1, maxLength: 120 }
        bailCategory: { $ref: "#/components/schemas/BailCategory" }
        financialBasis: { oneOf: [{ $ref: "#/components/schemas/FinancialBasis" }, { type: "null" }] }
        amountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647 }
        orderDate: { type: ["string", "null"], format: date }
        sourceTitle: { type: string, minLength: 1, maxLength: 160 }
        sourceUrl: { type: string, format: uri, maxLength: 2000 }
        sourceRetrievedAt: { type: string, format: date-time }
        sourceObservedAt: { type: ["string", "null"], format: date-time }
        evidenceNote: { type: string, minLength: 1, maxLength: 4000 }
        realRecordAttestation: { type: boolean }
      required: [docketNumber, county, courtLevel, chargeGroup, bailCategory, financialBasis, amountCents, orderDate, sourceTitle, sourceUrl, sourceRetrievedAt, sourceObservedAt, evidenceNote, realRecordAttestation]
    BailRecordList:
      type: object
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/BailRecord" }
        total: { type: integer, minimum: 0 }
      required: [records, total]
    BailReviewInput:
      type: object
      properties:
        decision: { $ref: "#/components/schemas/BailReviewDecision" }
        orderInterpretation:
          type: string
          enum: [REVIEWED_OPERATIVE, SUPERSEDED, UNRESOLVED]
        comment: { type: ["string", "null"], maxLength: 1000 }
      required: [decision, orderInterpretation]
    BailRange:
      type: object
      properties:
        filters:
          type: object
          properties:
            courtLevel: { oneOf: [{ $ref: "#/components/schemas/CourtLevel" }, { type: "null" }] }
            county: { type: ["string", "null"] }
            chargeGroup: { type: ["string", "null"] }
            financialBasis: { oneOf: [{ $ref: "#/components/schemas/FinancialBasis" }, { type: "null" }] }
            bailCategory: { $ref: "#/components/schemas/BailCategory" }
          required: [courtLevel, county, chargeGroup, financialBasis, bailCategory]
        reviewedRecordCount: { type: integer, minimum: 0 }
        minimumCents: { type: ["integer", "null"], minimum: 0 }
        medianCents: { type: ["integer", "null"], minimum: 0 }
        maximumCents: { type: ["integer", "null"], minimum: 0 }
        evaluatedAt: { type: string, format: date-time }
        note: { type: string }
      required: [filters, reviewedRecordCount, minimumCents, medianCents, maximumCents, evaluatedAt, note]
    ApiError:
      type: object
      properties:
        error: { type: string }
      required: [error]
  responses:
    Unauthorized:
      description: Workspace password required or incorrect
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Record not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Record has already been reviewed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Request did not originate from the research app
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    TooManyRequests:
      description: Too many incorrect workspace passwords were entered
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unavailable:
      description: Workspace password or session signing secret is not configured
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

